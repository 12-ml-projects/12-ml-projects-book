name: CI

on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run check-format
      - name: Read Hugo version
        id: hugo-version
        run: echo "version=$(cat .hugo-version)" >> $GITHUB_OUTPUT
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true
      - name: Build Website
        run: npm run build
